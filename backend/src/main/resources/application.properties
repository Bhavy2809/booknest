spring.application.name=booknest
server.port=8080

# ---- Database: H2 stored as a file in your home folder (survives restarts) ----
# (Kept outside the project so OneDrive/Git do not try to sync a changing DB file.)
# To start fresh, stop the server and delete the folder ~/.booknest
spring.datasource.url=jdbc:h2:file:~/.booknest/db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL is the one above)
spring.h2.console.enabled=true

# ---- Auth ----
# Secret used to sign login tokens. Change it for anything beyond a class demo.
app.token-secret=${BOOKNEST_TOKEN_SECRET:booknest-dev-secret-change-me-please-32chars}
app.token-ttl-hours=168

# ---- LLM (Large Language Model) for the chatbot and the "why this book" sentences ----
# Default provider: Google Gemini (free key from https://aistudio.google.com/apikey).
# Put the key in an environment variable GEMINI_API_KEY, or (easier) in a file named
# backend/application-local.properties containing one line:   app.llm.api-key=YOUR_KEY
# With no key at all the app still works: it falls back to the offline rule-based engine.
app.llm.api-key=${LLM_API_KEY:${GEMINI_API_KEY:}}
app.llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.llm.model=${LLM_MODEL:gemini-3.8-flash}
# Tried in order if the main model says "not found" or "quota exceeded" (free quotas differ per model)
app.llm.fallback-models=${LLM_FALLBACK_MODELS:gemini-3.5-flash,gemini-2.5-flash}
# "low" keeps the model's built-in thinking short so answers arrive in seconds. Leave empty for providers that do not know it.
app.llm.reasoning-effort=${LLM_REASONING_EFFORT:low}
app.llm.provider=${LLM_PROVIDER:Gemini}

# Optional alternative: Claude (needs a paid API key). Used only if no Gemini/LLM key is set.
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}

# Optional local file for secrets (ignored by Git). Create backend/application-local.properties.
spring.config.import=optional:file:./application-local.properties

# Allowed browser origin(s) for the React dev server
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173
